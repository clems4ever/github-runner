name: runner version

# The runner baked into the golden image has an expiry date, and it is not ours
# to set. GitHub deprecates old runner versions server-side, and a deprecated
# runner does not warn: it registers, connects, is told "this version cannot
# receive messages", and exits. On ephemeral machines that is a boot loop with
# no jobs ever running, which is what 2.330.0 did to a real fleet for a day.
#
# So the version is checked weekly against GitHub's own latest release, and a
# pull request is opened when it has moved. Merging it changes the image hash,
# so every host builds a fresh golden image the next time it starts a machine.

on:
  schedule:
    # Mondays, early. A week of drift is well inside GitHub's deprecation
    # window, which is measured in months.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: What is current, and what do we ship
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh release view --repo actions/runner --json tagName --jq .tagName)
          latest=${latest#v}
          ours=$(grep -oP 'RunnerVersion = "\K[^"]+' internal/agent/cloudinit.go)

          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "ours=${ours}" >> "$GITHUB_OUTPUT"
          echo "The image carries ${ours}; GitHub's latest is ${latest}." >> "$GITHUB_STEP_SUMMARY"

      - name: Bump it
        if: steps.versions.outputs.latest != steps.versions.outputs.ours
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.versions.outputs.latest }}
          OURS: ${{ steps.versions.outputs.ours }}
        run: |
          set -euo pipefail
          branch="runner-${LATEST}"

          # WHAT THIS GUARD USED TO ASK, AND WHY IT WAS THE WRONG QUESTION.
          #
          # It asked whether a pull request was open, and left if one was. But
          # what this job creates first is a BRANCH, and the two come apart the
          # moment the second step fails — which is exactly what happened on
          # 2026-08-31: the push landed, `gh pr create` was refused, and the
          # repository was left with `runner-2.337.0` and no pull request.
          #
          # Every Monday after that, the guard saw no open pull request, rebuilt
          # the branch from a fresh main, and pushed it into the one already
          # there:
          #
          #     ! [rejected]  runner-2.337.0 -> runner-2.337.0 (fetch first)
          #
          # Three weeks of red, each reporting a git error that says nothing
          # about the refusal that caused it, while the version this workflow
          # exists to move sat still.
          #
          # So it asks about the branch too, and treats one that is already
          # there as this job's own work rather than as a collision: the commit
          # is reproducible from LATEST, so pushing it again over a stale one is
          # a rebase onto current main, not a loss.
          if gh pr list --head "$branch" --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "::notice::${LATEST} is already proposed"
            exit 0
          fi

          sed -i "s/RunnerVersion = \"${OURS}\"/RunnerVersion = \"${LATEST}\"/" internal/agent/cloudinit.go
          # The test names the floor as well, so it moves with it.
          sed -i "s/RunnerVersion < \"${OURS}\"/RunnerVersion < \"${LATEST}\"/" internal/agent/console_test.go
          go test ./internal/agent/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Carry actions runner ${LATEST} in the golden image

          GitHub deprecates old runner versions server-side, and a deprecated
          runner cannot receive jobs at all — it connects, is refused, and exits,
          which on an ephemeral machine is a boot loop rather than an error.

          Merging this changes the image hash, so each host builds a fresh golden
          image the next time it starts a machine."

          # --force-with-lease rather than --force: it replaces the branch this
          # job left behind, and refuses if somebody else has been working on
          # one by that name.
          git push --force-with-lease -u origin "$branch"

          # THE REFUSAL THAT STARTED ALL OF THIS, REPORTED AS ITSELF.
          #
          # `GITHUB_TOKEN` cannot open a pull request when the organisation has
          # "Allow GitHub Actions to create and approve pull requests" turned
          # off, and an organisation that turns it off locks its repositories
          # out of overriding it. Nothing here can change that, so the useful
          # thing is to say which setting it is and leave the branch — which is
          # pushed, tested, and one click from a pull request — rather than to
          # fail with a git error four weeks later.
          if ! gh pr create \
            --title "Carry actions runner ${LATEST} in the golden image" \
            --body "GitHub's latest runner is \`${LATEST}\`; the golden image carries \`${OURS}\`.

          Old versions are deprecated server-side and cannot receive jobs — the runner connects, is refused, and exits, which on an ephemeral machine looks like a boot loop rather than an error. Merging this changes the image hash, so every host builds a fresh golden image the next time it starts a machine.

          Opened by the weekly \`runner version\` workflow."; then
            {
              echo "### The branch is pushed; the pull request is not"
              echo
              echo "\`${branch}\` carries the bump and its tests pass. Opening the pull"
              echo "request failed — if the reason above is *not permitted to create or"
              echo "approve pull requests*, that is an organisation setting"
              echo "(**Settings → Actions → General → Workflow permissions**) and no token"
              echo "this job has can get round it."
              echo
              echo "[Open it by hand](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${branch}?expand=1)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
