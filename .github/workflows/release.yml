name: release

# Two ways in, one path out.
#
#   - push a tag         git tag v0.2.0 && git push origin v0.2.0
#   - or press the button  Actions → release → Run workflow, pick patch/minor/major
#
# The button does the tagging itself rather than pushing a tag and hoping this
# workflow runs again: a tag pushed by GITHUB_TOKEN deliberately does not
# trigger other workflows, so a two-step version would create the tag and then
# quietly release nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or an exact version, like v1.2.0 (overrides the choice above)
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # goreleaser reads the tag history to work out the version and the
          # changelog, so a shallow clone is not enough.
          fetch-depth: 0

      # Releases come from main. A release cut from a branch is almost always
      # a mistake, and it is one that is awkward to take back once the tag is
      # public.
      - name: Check the branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::releases are cut from main; this ran on ${GITHUB_REF#refs/heads/}"
          exit 1

      - name: Work out the version
        if: github.event_name == 'workflow_dispatch'
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$EXPLICIT" ]; then
            version=$EXPLICIT
          else
            latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            version="v${major}.${minor}.${patch}"
            echo "the last release was ${latest}"
          fi

          # A tag that already exists means someone released this version
          # already; moving it would change what people have installed.
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "::error::${version} already exists"
            exit 1
          fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${version} is not vMAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "### Releasing ${version}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Nothing is published that has not passed the suite: a release is what
      # the installer hands people, and it runs as root on their host.
      - name: Test
        run: |
          go vet ./...
          go test ./...
          npm --prefix web ci
          npm --prefix web test

      # Before the tag, not after it. A deprecated key in .goreleaser.yaml only
      # shows up when goreleaser runs, and by then the tag is pushed — which
      # leaves a version that exists in git and nowhere else. `check` exits
      # non-zero on a deprecation, not just on invalid config, so a key on its
      # way out stops the release while stopping it is still free.
      - name: Check the release config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check

      # Tagged only once the tests have passed, so a failed release leaves no
      # tag behind to clean up.
      - name: Tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "runner-fleet ${VERSION}"
          git push origin "$VERSION"

      # v7 rather than v6: v6 declares Node 20, which the runners no longer
      # provide — they force it onto Node 24 and annotate the job with a
      # deprecation warning. v7 is the same action declaring Node 24, with the
      # same inputs.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Say where it went
        run: |
          version=${{ steps.version.outputs.version || github.ref_name }}
          {
            echo "Released **${version}**."
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash'
            echo '```'
            echo
            echo "Rerunning that on a host that already has it is an upgrade, and the runners keep going."
          } >> "$GITHUB_STEP_SUMMARY"
