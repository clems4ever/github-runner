name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector matters here: the reconcile loop, the HTTP handlers
      # and the Docker executor's background drains all touch the same state.
      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web test

  # The tests beside the code fake Docker, which checks this code against its
  # author's assumptions. This job checks the assumptions: it runs a real
  # container from the real runner image, which is the only thing that can say
  # the runner is where we think it is, that what the container is given can be
  # read, and that the agent accepts what the daemon sends it.
  #
  # It has been lost once already — added in a commit after a pull request's
  # last CI run, then dropped by a merge from a branch that predated it — and in
  # the window where it did not exist, two of the three bugs it covers shipped.
  # If this job is ever missing from this file again, that is the bug.
  container-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      # Pulled here rather than inside the test, so a slow pull reads as a slow
      # step instead of a mysterious timeout.
      - name: Pull the runner image
        run: docker pull ghcr.io/actions/actions-runner:latest

      - name: Run a real container runner
        run: go test -tags docker -v -timeout 15m ./internal/executor/docker/

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shellcheck
        run: shellcheck -S warning install.sh

      - name: The unit file is valid
        run: systemd-analyze verify packaging/runner-fleetd.service 2>&1 | grep -v "not executable" | (! grep .)

      # Run it the way people run it: piped into bash, as root, on a host with
      # systemd. Reading the script is not enough — it is read from standard
      # input when piped, so any command inside it that consumes stdin eats the
      # rest of the script and bash reports a syntax error in the middle of
      # nowhere. That shipped once, and only this catches it.
      #
      # The runner is a disposable VM, so installing a real service on it is
      # fine.
      - name: Install it for real, from a pipe
        env:
          FLEET_PASSWORD: an-install-test-password
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh" \
            | sudo -E bash

      - name: It came up
        run: |
          set -euo pipefail
          systemctl is-active --quiet runner-fleetd
          curl -fsS http://127.0.0.1:8080/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          # The password the installer was given is the one it set.
          curl -fsS -u "admin:an-install-test-password" http://127.0.0.1:8080/api/pools >/dev/null

      # Rerunning is how people upgrade, and it must not stop to ask anything
      # or move the address out from under them.
      - name: Upgrading over it is quiet
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh" \
            | sudo -E ADDR=127.0.0.1:8181 bash
          systemctl is-active --quiet runner-fleetd
          curl -fsS http://127.0.0.1:8181/api/health | grep -q '"status":"ok"'

          # And again with no address given: it keeps the one it has rather
          # than moving back to the default.
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh" \
            | sudo -E bash
          curl -fsS http://127.0.0.1:8181/api/health | grep -q '"status":"ok"'

      - name: And uninstall puts the host back
        run: |
          set -euo pipefail
          sudo runner-fleet version
          sudo systemctl stop runner-fleetd
          sudo rm -rf /etc/runner-fleet /var/lib/runner-fleet /usr/local/bin/runner-fleet
