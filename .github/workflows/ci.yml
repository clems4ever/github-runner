name: ci

# This workflow runs on the fleet this repository builds.
#
# Two rules decide where each job goes.
#
# A pull request from a fork runs on GitHub's runners, never on ours. This
# repository is public, so a fork's pull request is a stranger's code, and a
# self-hosted runner would run it on our host. `head.repo.fork` is empty for
# anything that is not a pull request, so pushes to main use the fleet.
#
# A job that needs a Docker daemon, root, systemd or a C compiler gets a
# machine; everything else gets a container. That is not a preference: the
# official runner image has no compiler and no daemon, which
# TestTheOfficialImageHasNoCToolchain checks against the real image.
#
# To take CI off the fleet, replace the two expressions with ubuntu-latest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # A machine: `go test -race` needs cgo, and so a C compiler.
  go:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "vm"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector matters here: the reconcile loop, the HTTP handlers
      # and the Docker executor's background drains all touch the same state.
      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      # The release job runs this too, but it runs it on the day of a release,
      # which is the worst day to find out that a key in .goreleaser.yaml is on
      # its way out. Here it costs a pull request instead.
      - name: The release config is still current
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check

      # The daemon runs as root and the runners' agents do not, so half of what
      # the daemon writes is written for somebody else to read. A test running
      # as one user cannot check that, and while there was no test that could,
      # every machine runner on a packaged install died on "permission denied"
      # reading its credential.
      #
      # Built as this user and run as root, so root never touches the module
      # cache.
      - name: The service user can read what the daemon wrote
        env:
          REQUIRE_ROOT: '1'
        run: |
          set -euo pipefail
          go test -tags root -c -o /tmp/cross-user-test ./cmd/runner-fleet/
          sudo -E /tmp/cross-user-test -test.v

  # A container: node and npm come from setup-node, and nothing here leaves the
  # working tree.
  ui:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "container"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web test

  # The tests beside the code fake Docker, which checks this code against its
  # author's assumptions. This job checks the assumptions: it runs a real
  # container from the real runner image, which is the only thing that can say
  # the runner is where we think it is, that what the container is given can be
  # read, and that the agent accepts what the daemon sends it.
  #
  # It has been lost once already — added in a commit after a pull request's
  # last CI run, then dropped by a merge from a branch that predated it — and in
  # the window where it did not exist, two of the three bugs it covers shipped.
  # If this job is ever missing from this file again, that is the bug.
  #
  # A machine: this needs a Docker daemon it may create and destroy containers
  # in. Handing it the host's socket instead would give the job root on the host
  # and, worse for this test, the daemon that runs the fleet's own runners —
  # which are found by the same labels these containers carry.
  container-runner:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "vm"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      # Pulled here rather than inside the test, so a slow pull reads as a slow
      # step instead of a mysterious timeout.
      - name: Pull the runner image
        run: docker pull ghcr.io/actions/actions-runner:latest

      - name: Run a real container runner
        # REQUIRE_DOCKER turns a skip into a failure. Without it, a runner
        # without Docker would report a green tick for a test that never ran,
        # which is the exact shape of the problem this job exists to catch.
        env:
          REQUIRE_DOCKER: '1'
        run: go test -tags docker -v -timeout 15m ./internal/executor/docker/

  # A machine, and an ephemeral one: this installs a systemd service as root,
  # binds a port, and deletes what it installed. A container has no systemd to
  # install into, and a runner that took a second job after this one would
  # inherit a host somebody had been root on.
  installer:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "vm"]') }}
    steps:
      - uses: actions/checkout@v5

      # shellcheck is in the golden image's package list, but a machine built
      # from an image made before it was added will not have it, and neither
      # would a host that is not one of ours. Installing it when it is missing
      # keeps this job from depending on which release built the image it is
      # running on.
      - name: Shellcheck
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -S warning install.sh

      - name: The unit file is valid
        run: systemd-analyze verify packaging/runner-fleetd.service 2>&1 | grep -v "not executable" | (! grep .)

      # Run it the way people run it: piped into bash, as root, on a host with
      # systemd. Reading the script is not enough — it is read from standard
      # input when piped, so any command inside it that consumes stdin eats the
      # rest of the script and bash reports a syntax error in the middle of
      # nowhere. That shipped once, and only this catches it.
      #
      # The runner is a disposable VM, so installing a real service on it is
      # fine.
      - name: Install it for real, from a pipe
        env:
          FLEET_PASSWORD: an-install-test-password
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh" \
            | sudo -E bash

      - name: It came up
        run: |
          set -euo pipefail
          systemctl is-active --quiet runner-fleetd
          curl -fsS http://127.0.0.1:8080/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          # The password the installer was given is the one it set.
          curl -fsS -u "admin:an-install-test-password" http://127.0.0.1:8080/api/pools >/dev/null

      # Everything above installed the latest release, which is what the
      # installer downloads and what people actually run. Everything below is
      # about this build, so it goes in here — over the top of the release, which
      # is also the upgrade every host performs.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Upgrade the install to this build
        run: |
          set -euo pipefail
          go build -o /tmp/runner-fleet ./cmd/runner-fleet
          sudo install -m 0755 /tmp/runner-fleet /usr/local/bin/runner-fleet
          sudo systemctl restart runner-fleetd
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8080/api/health >/dev/null && break
            sleep 1
          done
          systemctl is-active --quiet runner-fleetd

      # The same handover, on a real install: the daemon is root here, the
      # service user is one the installer created, and the directories a machine
      # agent reads from have to belong to it. Checked by being that user, not
      # by reading modes.
      #
      # And checked after an upgrade rather than a fresh install, because that is
      # the harder case: the release that ran first left these root-owned, and a
      # daemon that only fixed ownership on directories it created itself would
      # leave every existing host broken.
      - name: A machine agent can reach what it needs
        run: |
          set -euo pipefail
          for dir in /run/runner-fleet /run/runner-fleet/credentials /var/lib/runner-fleet; do
            # As root, because these are 0700 and this job's user is neither
            # root nor the service user — which is the point of them.
            owner=$(sudo stat -c '%U' "$dir")
            if [ "$owner" != "runner-fleet" ]; then
              echo "::error::$dir belongs to $owner; a machine runner could not use it"
              exit 1
            fi
            sudo -u runner-fleet test -r "$dir" -a -x "$dir" || {
              echo "::error::the service user cannot enter $dir"
              exit 1
            }
          done

      # Rerunning is how people upgrade, and it must not stop to ask anything
      # or move the address out from under them.
      - name: Upgrading over it is quiet
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh" \
            | sudo -E ADDR=127.0.0.1:8181 bash
          systemctl is-active --quiet runner-fleetd
          curl -fsS http://127.0.0.1:8181/api/health | grep -q '"status":"ok"'

          # And again with no address given: it keeps the one it has rather
          # than moving back to the default.
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh" \
            | sudo -E bash
          curl -fsS http://127.0.0.1:8181/api/health | grep -q '"status":"ok"'

      - name: And uninstall puts the host back
        run: |
          set -euo pipefail
          sudo runner-fleet version
          sudo systemctl stop runner-fleetd
          sudo rm -rf /etc/runner-fleet /var/lib/runner-fleet /usr/local/bin/runner-fleet
