name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector matters here: the reconcile loop, the HTTP handlers
      # and the Docker executor's background drains all touch the same state.
      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web test

  # The tests beside the code fake Docker, which checks this code against its
  # author's assumptions. This job checks the assumptions: it runs a real
  # container from the real runner image, which is the only thing that can tell
  # us the runner is where we think it is and that what we hand the container is
  # readable by it. Both of those shipped wrong once.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      # Pulled here rather than inside the test, so a slow pull reads as a slow
      # step instead of a mysterious timeout.
      - name: Pull the runner image
        run: docker pull ghcr.io/actions/actions-runner:latest

      - name: Integration tests
        run: go test -tags docker -v -timeout 15m ./internal/executor/docker/

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shellcheck
        run: shellcheck -S warning install.sh
      - name: The unit file is valid
        run: systemd-analyze verify packaging/runner-fleetd.service 2>&1 | grep -v "not executable" | (! grep .)
