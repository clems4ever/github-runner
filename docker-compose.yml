services:
  runner:
    # Published by .github/workflows/build.yml. To build locally instead:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/clems4ever/github-runner:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Give the runner time to finish its job on `compose down`.
    stop_grace_period: 5m
    environment:
      GITHUB_URL: ${GITHUB_URL:?set GITHUB_URL in .env}
      # Registration token from Settings > Actions > Runners > New self-hosted
      # runner. Only read until the runner has registered: the registration
      # lands in the runner-state volume and is reused on every restart.
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # Left empty so the container hostname is used, which keeps names unique
      # when scaling with `docker compose up -d --scale runner=3`.
      RUNNER_NAME: ${RUNNER_NAME:-}
      RUNNER_LABELS: ${RUNNER_LABELS:-}
      RUNNER_GROUP: ${RUNNER_GROUP:-Default}
      EPHEMERAL: ${EPHEMERAL:-false}
      DISABLE_UPDATE: ${DISABLE_UPDATE:-false}
    volumes:
      - runner-state:/home/runner/.runner-state
      # Uncomment to let jobs use the host Docker daemon. This grants the
      # runner root-equivalent access to the host, so only do it for trusted
      # workflows.
      # - /var/run/docker.sock:/var/run/docker.sock
    # Uncomment to let jobs run hardware-accelerated VMs (Android emulator,
    # QEMU/libvirt, ...). No privileged mode needed, but the device is owned by
    # the host's kvm group, hence the matching group_add entry.
    # devices:
    #   - /dev/kvm:/dev/kvm
    # Groups the runner joins on top of its own; uncomment the line that goes
    # with each of the two blocks above.
    # group_add:
    #   - ${DOCKER_GID:-988}
    #   - ${KVM_GID:-104}

volumes:
  # Keeps the registration (and only that) across `compose down` / `up`, so a
  # runner never needs a second token.
  runner-state:
