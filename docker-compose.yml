services:
  runner:
    build:
      context: .
      args:
        RUNNER_VERSION: ${RUNNER_VERSION:-2.336.0}
        RUNNER_ARCH: ${RUNNER_ARCH:-x64}
        INSTALL_DOCKER_CLI: ${INSTALL_DOCKER_CLI:-false}
    image: github-runner:${RUNNER_VERSION:-2.336.0}
    restart: unless-stopped
    # Give the runner time to finish its job and de-register on `compose down`.
    stop_grace_period: 5m
    environment:
      GITHUB_URL: ${GITHUB_URL:?set GITHUB_URL in .env}
      # A PAT, so the container mints a fresh registration token every start.
      # Registration tokens taken from the web UI expire after one hour.
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # Left empty so the container hostname is used, which keeps names unique
      # when scaling with `docker compose up -d --scale runner=3`.
      RUNNER_NAME: ${RUNNER_NAME:-}
      RUNNER_LABELS: ${RUNNER_LABELS:-}
      RUNNER_GROUP: ${RUNNER_GROUP:-Default}
      EPHEMERAL: ${EPHEMERAL:-true}
      DISABLE_UPDATE: ${DISABLE_UPDATE:-false}
    # Uncomment (and build with INSTALL_DOCKER_CLI=true) to let jobs use the
    # host Docker daemon. This grants the runner root-equivalent access to the
    # host, so only do it for workflows you trust.
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - ${DOCKER_GID:-988}
