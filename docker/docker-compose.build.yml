# Overlay that builds the image locally instead of pulling it from GHCR:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  runner:
    build:
      # The repository root, not this directory: the image copies
      # ../entrypoint.sh, which both this and the VM setup share.
      context: ..
      dockerfile: docker/Dockerfile
      args:
        INSTALL_DOCKER_CLI: ${INSTALL_DOCKER_CLI:-true}
